[package]
name = "happycampr_carousels"
version = "0.1.0"
description = "Local-only daily activity capture"
authors = ["Joshua Anderson"]
edition = "2021"
# Two binaries (the Tauri app + happycampr-carousels-cli) means `tauri
# build` can't infer the main one — pin it. `happycampr_carousels` is
# src/main.rs (the app).
default-run = "happycampr_carousels"

[lib]
name = "happycampr_carousels_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Scriptable surface over the same backend the Tauri app uses (create a
# deck, add slides, import, generate, status, open). `src/main.rs` stays
# the default Tauri-app binary via Cargo autodiscovery.
[[bin]]
name = "happycampr-carousels-cli"
path = "src/bin/happycampr-carousels-cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
toml = "0.8"
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
# CLI arg parsing for the `happycampr-carousels-cli` binary (derive only).
# Hand-rolling 8 subcommands with usable `--help` isn't worth the churn;
# see STATUS.md. Only `src/bin/happycampr-carousels-cli.rs` uses clap —
# `happycampr_carousels_lib` and the Tauri app binary do not. Verified:
# `strings target/.../happycampr_carousels | grep clap`
# is empty (dead-code-eliminated), so the shipped app does NOT link clap.
# (Cargo has no clean per-bin deps without a sub-crate; the compile-time
# cost is accepted. A `cargo audit` hit on clap does NOT affect the app.)
clap = { version = "4", features = ["derive"] }
